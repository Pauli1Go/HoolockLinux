%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/apple,z2-multitouch.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple touchscreens attached using the Z2 protocol

maintainers:
  - Sasha Finkelstein <k@chaosmail.tech>
  - Paul Praschl <praschlpaul@g-p.at>

description: A series of touchscreen controllers used in Apple products

properties:
  compatible:
    enum:
      - apple,j293-touchbar
      - apple,j493-touchbar
      - apple,j172-touchscreen
      - apple,d11-touchscreen
      - apple,d111-touchscreen

  interrupts:
    maxItems: 1

  reset-gpios:
    maxItems: 1

  power-ana-gpios:
    maxItems: 1

  power-ldo-gpios:
    maxItems: 1

  hv-supply:
    description: High-voltage analog supply for the touchscreen controller

  core-supply:
    description: Core supply for the touchscreen controller

  display-sync-gpios:
    maxItems: 1

  display-sync1-gpios:
    maxItems: 1

  spi-cpha: true

  spi-cpol: true

  clocks:
    maxItems: 1

  apple,z2-bpw16-min-len:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Minimum firmware blob length sent using 16 bits per word.
    default: 1

  apple,z2-no-init-ack:
    description:
      Do not append the standard 0x1a 0xa1 ACK transfer after the initial
      firmware payload.
    type: boolean

  firmware-name:
    maxItems: 1

  apple,z2-cal-blob:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    maxItems: 4096
    description:
      Calibration blob supplied by the bootloader

  apple,z2-orb-gap-cal-blob:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    maxItems: 4096
    description:
      Orb gap calibration blob supplied by the bootloader

  apple,z2-orb-force-cal-blob:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    maxItems: 4096
    description:
      Orb force calibration blob supplied by the bootloader

  apple,z2-shape-accel-cal-blob:
    $ref: /schemas/types.yaml#/definitions/uint8-array
    maxItems: 4096
    description:
      Dynamic shape acceleration calibration blob supplied by the bootloader

required:
  - compatible
  - interrupts
  - reset-gpios
  - firmware-name
  - touchscreen-size-x
  - touchscreen-size-y

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#
  - if:
      properties:
        compatible:
          const: apple,j172-touchscreen
    then:
      properties:
        pinctrl-names:
          const: display-sync-active
      required:
        - clocks
        - power-ana-gpios
        - power-ldo-gpios
        - display-sync-gpios
        - display-sync1-gpios
        - pinctrl-0
        - pinctrl-names
        - spi-cpha
        - spi-cpol
        - apple,z2-bpw16-min-len
        - apple,z2-no-init-ack
  - if:
      properties:
        compatible:
          enum:
            - apple,d11-touchscreen
            - apple,d111-touchscreen
    then:
      required:
        - clocks
        - hv-supply
        - core-supply
        - spi-cpha
        - spi-cpol
        - apple,z2-no-init-ack

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "apple,j293-touchbar";
            reg = <0>;
            spi-max-frequency = <11500000>;
            reset-gpios = <&pinctrl_ap 139 GPIO_ACTIVE_LOW>;
            interrupts-extended = <&pinctrl_ap 194 IRQ_TYPE_EDGE_FALLING>;
            firmware-name = "apple/dfrmtfw-j293.bin";
            touchscreen-size-x = <23045>;
            touchscreen-size-y = <640>;
        };
    };

...
